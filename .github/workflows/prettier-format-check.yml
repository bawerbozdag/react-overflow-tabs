name: Prettier Format Check

on:
    pull_request:
        branches: ["**"]
        paths: ["**"]

permissions:
    contents: read

jobs:
    prettier:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: package-lock.json
            - run: npm install
            - name: Run Prettier Check
              run: npm run format:check

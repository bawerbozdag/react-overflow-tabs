name: Prettier Format Check

on:
    pull_request:

permissions:
    contents: read

jobs:
    prettier:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: npm ci
            - name: Run Prettier Check
              run: npm run format:check

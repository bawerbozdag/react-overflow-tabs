name: CI

on:
    push:
        branches: [master]
    pull_request:

jobs:
    ci:
        name: Typecheck, Lint, Test & Build
        runs-on: ubuntu-22.04

        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: TypeScript type check
              run: npm run typecheck

            - name: Run ESLint
              run: npm run lint

            - name: Run tests
              run: npm test

            - name: Build
              run: npm run build

            - name: Check dist output
              run: test -f dist/index.js && test -f dist/index.cjs && test -f dist/index.d.ts
